name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject private paths in tracked files
        shell: bash
        run: |
          git ls-files -z | python3 -c '
          import re, sys
          pattern = re.compile(rb"(^|/)(internal/|claude(\.local)?\.md$|\.claude/|\.env|\.codex/|\.mcp\.json$|\.ds_store$|[^/]*\.pem$)", re.I)
          paths = [path for path in sys.stdin.buffer.read().split(b"\0") if pattern.search(path)]
          for path in paths:
              print("Private tracked path: " + repr(path))
          sys.exit(bool(paths))
          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm check
      # The spec vectors are generated; fail if a generator and its committed file differ.
      - run: node specs/vectors/near-settlement.mjs && node specs/vectors/pay2.mjs && node specs/vectors/texts.mjs && node specs/vectors/base-headers.mjs && node specs/vectors/nonce.mjs > /dev/null && node specs/vectors/buyer-proof.mjs > /dev/null && git diff --exit-code specs/vectors
      - run: pnpm build
      - run: pnpm test
      - run: ANNON_TEST_CONTAINER=1 pnpm --filter @defdone/annon-relayer exec vitest run -t "starts after the Docker prod-filter install"

  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Explicit install from rust-toolchain.toml; the action alone relies on rustup's deprecated
      # auto-install and warns about it.
      - run: rustup toolchain install
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: contracts/annon/build.sh # wasm for the import check and the sandbox tests
      - run: cargo test

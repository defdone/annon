packages:
  - packages/*
  - apps/*

saveExact: true
# Don't resolve packages published less than 14 days ago (in minutes).
minimumReleaseAge: 20160

overrides:
  '@modelcontextprotocol/sdk@1.32.2>hono': '4.13.18'
  '@modelcontextprotocol/sdk@1.32.2>@hono/node-server': '2.1.7'
  # Meteor Wallet SDK 1.0.24 pins nanoid 5.1.5; 5.1.16 carries the published nanoid fixes.
  '@meteorwallet/sdk@1.0.24>nanoid': '5.1.16'

# Security fixes; exact releases only.
# Recheck after 2026-11-25; remove exceptions once both clear 14 days.
minimumReleaseAgeExclude:
  - 'hono@4.13.18'
  - '@hono/node-server@2.1.7'

# Wallet Selector uses secp256k1's JS fallback; esbuild uses its optional platform binary.
# ws (pulled in by the HOT Wallet SDK) falls back to JS without bufferutil and utf-8-validate.
# None of these dependencies needs an install-time native build in this workspace.
allowBuilds:
  secp256k1: false
  esbuild: false
  bufferutil: false
  utf-8-validate: false

packages:
  - packages/*
  - apps/*

saveExact: true
# Don't resolve packages published less than 14 days ago (in minutes).
minimumReleaseAge: 20160

overrides:
  '@modelcontextprotocol/sdk@1.32.2>hono': '4.13.18'
  '@modelcontextprotocol/sdk@1.32.2>@hono/node-server': '2.1.7'

# Security fixes; exact releases only.
# Recheck after 2026-11-25; remove exceptions once both clear 14 days.
minimumReleaseAgeExclude:
  - 'hono@4.13.18'
  - '@hono/node-server@2.1.7'

# Wallet Selector uses secp256k1's JS fallback; esbuild uses its optional platform binary.
# Neither dependency needs an install-time native build in this workspace.
allowBuilds:
  secp256k1: false
  esbuild: false

packages:
  - packages/*
  - apps/*

saveExact: true
# Don't resolve packages published less than 14 days ago (in minutes).
minimumReleaseAge: 20160

overrides:
  '@modelcontextprotocol/sdk@1.32.2>hono': '4.13.16'
  '@modelcontextprotocol/sdk@1.32.2>@hono/node-server': '2.1.6'

# Security fixes; exact releases only.
# Recheck 2026-11-16 and remove once both pass the 14-day cutoff.
minimumReleaseAgeExclude:
  - 'hono@4.13.16'
  - '@hono/node-server@2.1.6'

# Wallet Selector uses secp256k1's JS fallback; esbuild uses its optional platform binary.
# Neither dependency needs an install-time native build in this workspace.
allowBuilds:
  secp256k1: false
  esbuild: false

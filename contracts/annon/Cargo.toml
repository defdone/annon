[package]
name = "annon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/defdone/annon"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unstable"] }  # unstable: only for env::ecrecover
hex = "0.4"
bs58 = "0.5"
# Pinned to the revision of v1.signer on mainnet (3.17.0): payload types and hash.
near-mpc-contract-interface = { git = "https://github.com/near/mpc", rev = "d0fc87b19e2643299e7becdd7d9611afcd5d5a78" }
near-mpc-bounded-collections = { git = "https://github.com/near/mpc", rev = "d0fc87b19e2643299e7becdd7d9611afcd5d5a78" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2.2.0"
sha3 = "0.10"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[package]
name = "annon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/defdone/annon"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Release build (`contracts/annon/build.sh --release`): cargo near build reproducible-wasm runs this
# command in the image pinned by digest, on the committed source mounted at /home/near/code, so the
# same commit gives the same wasm on any machine. The recipe is recorded in contract_source_metadata.
# RUSTFLAGS keeps the local build's flags (cargo-near adds --cfg near); --no-abi because the MPC
# interface types have no JSON schema without its abi feature.
[package.metadata.near.reproducible_build]
image = "ghcr.io/near/cargo-near:0.23.0-rust-1.97.1"
image_digest = "sha256:d862a0e3727153b490726de8295402838bba3276c574edde82302617bc279486"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
    "--env",
    "RUSTFLAGS=-C target-cpu=mvp -C link-arg=-s --remap-path-prefix=/home/near/.cargo=/cargo --remap-path-prefix=/home/near/code=/annon",
]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unstable"] }  # unstable: only for env::ecrecover
hex = "0.4"
bs58 = "0.5"
# Pinned to the revision of v1.signer on mainnet (3.17.0): payload types and hash.
near-mpc-contract-interface = { git = "https://github.com/near/mpc", rev = "d0fc87b19e2643299e7becdd7d9611afcd5d5a78" }
near-mpc-bounded-collections = { git = "https://github.com/near/mpc", rev = "d0fc87b19e2643299e7becdd7d9611afcd5d5a78" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2.2.0"
sha3 = "0.10"
sha2 = "0.10"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

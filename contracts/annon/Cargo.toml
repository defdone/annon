[package]
name = "annon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/defdone/annon"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unstable"] }  # unstable: only for env::ecrecover
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
